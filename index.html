<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kingdoms of Canaan</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Kingdoms of Canaan</h1>
      <p>Move your armies across Canaan. State is saved in your browser.</p>
    </header>

    <main>
      <section class="toolbar" aria-label="Map controls">
        <div class="turn-status" aria-live="polite">
          <div class="turn-status-summary">
            <span id="current-turn">Turn 1 of 9</span>
            <span id="current-nation">Hebrew</span>
            <span id="current-phase">Growth Phase</span>
          </div>
          <span id="phase-help">Leaders and invaders enter. Growth resolves during Growth Phase.</span>
        </div>
        <button id="next-phase" type="button">Advance to Action Phase</button>
        <button id="skip-turn" type="button">Skip Turn</button>
        <button id="run-ai-turn" type="button">Run AI Turn</button>
        <button id="run-full-ai-turn" type="button">Run Full AI Turn</button>
        <label for="zoom-range">Zoom</label>
        <input id="zoom-range" type="range" min="0.5" max="2" step="0.1" value="1" />
        <span id="zoom-value">100%</span>
        <label class="toggle-inline" for="show-region-labels">
          <input id="show-region-labels" type="checkbox" checked />
          Show region labels
        </label>
        <label class="toggle-inline" for="scenario-mode">
          Scenario mode
        </label>
        <select id="scenario-mode" aria-label="Scenario mode">
          <option value="standard">Standard</option>
          <option value="divided-kingdom">Scenario - Divided Kingdom</option>
        </select>
        <button id="reset-game" type="button">Reset</button>
        <span id="combat-status" aria-live="polite"></span>
        <span id="mouse-coords" aria-live="polite">Mouse: -, -</span>
        <span id="space-count" aria-live="polite">Spaces: analyzing...</span>
        <details id="vp-panel" class="vp-panel">
          <summary id="vp-summary">VP: no points yet</summary>
          <div id="vp-table" aria-live="polite"></div>
        </details>
      </section>

      <section id="map-viewport" aria-label="Scrollable game map">
        <div id="map-canvas" role="application" aria-label="Game map with movable unit counters">
          <svg id="adjacency-layer" aria-hidden="true"></svg>
          <div id="spaces-layer" aria-hidden="true"></div>
        </div>
      </section>
    </main>

    <script src="nation-ai.js"></script>
    <script src="script.js"></script>
  </body>
</html>
